name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List schemes (debug)
        run: xcodebuild -list -project ScreenTranslate.xcodeproj

      - name: Build unsigned .app
        run: |
          set -o pipefail
          xcodebuild \
            -project ScreenTranslate.xcodeproj \
            -scheme ScreenTranslate \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/ScreenTranslate.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ScreenTranslate.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslate-ipa
          path: ScreenTranslate.ipa
